<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmetic Recommender (placeholder UI)</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px}
fieldset{margin:20px 0}label{display:block;margin:6px 0}pre{background:#f4f4f4;padding:10px;overflow:auto}
.sw{display:inline-block;width:18px;height:18px;vertical-align:middle;border:1px solid #888;margin-right:6px}</style></head><body>
<h1>Cosmetic Recommender</h1><p><em>Placeholder UI. Styling comes later.</em></p>

<fieldset><legend><b>1. Skincare (ML model)</b></legend>
<label>Skin type <select id="skin"><option value="">Not sure</option><option>Combination</option><option>Dry</option><option>Normal</option><option>Oily</option></select></label>
<label>Category <select id="cat"><option value="">Any</option><option>Cleanser</option><option>Moisturizer</option><option>Treatment</option><option>Face Mask</option></select></label>
<label>Max price <input id="price" type="number" min="0"></label>
<label>Avoid ingredients <input id="avoid" placeholder="fragrance, alcohol"></label>
<label>A product you liked <input id="liked" list="products"></label><datalist id="products"></datalist>
<label><input id="sens" type="checkbox"> Sensitive skin</label>
<button id="go1">Recommend</button><div id="out1"></div></fieldset>

<fieldset><legend><b>2. Makeup foundation match (OpenCV)</b></legend>
<label>Face photo <input id="photo" type="file" accept="image/*"></label>
<label>Brand (optional) <select id="brand"><option value="">Any</option></select></label>
<button id="go2">Find my shade</button><div id="out2"></div></fieldset>

<script>
const $=id=>document.getElementById(id),ids={};
const show=(el,x)=>el.innerHTML=x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/skincare/products?limit=400').then(r=>r.json()).then(ps=>ps.forEach(p=>{const l=`${p.Product} (${p.Brand})`;ids[l]=p.Product_id;
 const o=document.createElement('option');o.value=l;$('products').append(o)}));
fetch('/makeup/brands').then(r=>r.json()).then(bs=>bs.forEach(b=>{const o=document.createElement('option');o.textContent=b;$('brand').append(o)}));
$('go1').onclick=async()=>{const liked=ids[$('liked').value];
 const body={skin_type:$('skin').value||null,category:$('cat').value||null,max_price:$('price').value?+$('price').value:null,
  sensitive:$('sens').checked,avoid_ingredients:$('avoid').value.split(',').map(s=>s.trim()).filter(Boolean),liked_product_ids:liked?[liked]:[],k:8};
 show($('out1'),'Loading...');
 const r=await fetch('/skincare/recommend',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)return show($('out1'),'Error '+r.status);
 const j=await r.json();
 show($('out1'),j.count?'<ol>'+j.results.map(p=>`<li><b>${esc(p.Product)}</b> (${esc(p.Brand)}, ${esc(p.Category)}, $${p.Price})<br><small>${esc(p.why)}</small></li>`).join('')+'</ol>':'No matches.')};
$('go2').onclick=async()=>{const f=$('photo').files[0];if(!f)return show($('out2'),'Choose a photo first.');
 show($('out2'),'Analysing...');
 const r=await fetch('/makeup/match-photo?k=6'+($('brand').value?'&brand='+encodeURIComponent($('brand').value):''),{method:'POST',body:f});
 const j=await r.json();if(!r.ok)return show($('out2'),esc(j.detail||r.status));
 show($('out2'),`<p>Skin colour <span class="sw" style="background:${esc(j.face.skin_hex)}"></span>${esc(j.face.skin_hex)}, tone: <b>${esc(j.face.tone)}</b></p><ol>`+
  j.matches.map(m=>`<li><span class="sw" style="background:${esc(m.hex)}"></span><b>${esc(m.brand)} ${esc(m.product)}</b> ${esc(m.hex)} <small>(colour difference ${m.delta_e})</small></li>`).join('')+'</ol>')};
</script></body></html>
