<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmetic Consultation</title>
<!-- BAREBONES STRUCTURE. Restyle freely: keep the ids and data-endpoint attributes, they are what the script binds to.
     Endpoint contract: /docs (live OpenAPI) and docs/FRONTEND.md. -->
<style>
body{font:15px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px;color:#222}
section{border:1px solid #ddd;margin:16px 0;padding:12px 16px}
h1,h2,h3{margin:.3em 0}fieldset{border:1px solid #eee;margin:10px 0}label{margin-right:12px;display:inline-block}
.badge{font-size:11px;border:1px solid #999;padding:0 6px;border-radius:9px;margin-left:6px;color:#555}
.badge.planned{border-style:dashed}.card{border:1px solid #eee;padding:8px;margin:6px 0}
.sw{display:inline-block;width:24px;height:24px;border:1px solid #888;vertical-align:middle;margin-right:6px}
.err{color:#b00}.meta{color:#666;font-size:13px}img#preview{max-width:140px;display:block;margin:6px 0}
</style></head><body>

<header>
  <h1>Cosmetic Consultation</h1>
  <p class="meta">Tell us about your skin and colouring, optionally add a photo, and get a complete list.</p>
</header>

<main>
<!-- ============ STEP 1: PROFILE  (GET /api/v1/options fills the controls) ============ -->
<section id="step-profile" data-endpoint="GET /api/v1/options">
  <h2>1. Your skin</h2>
  <label>Skin type <select id="skin_type"><option value="">Not sure</option></select></label>
  <label>Max price per product ($) <input id="max_price" type="number" min="0" style="width:80px"></label>
  <label><input id="sensitive" type="checkbox"> Sensitive skin</label>
  <fieldset><legend>Concerns</legend><div id="concerns"></div></fieldset>
  <fieldset><legend>Colour preferences</legend><div id="colour_prefs"></div></fieldset>
  <label>Ingredients to avoid <input id="avoid" placeholder="fragrance, alcohol"></label>
</section>

<!-- ============ STEP 2: PHOTO  (POST /api/v1/face/analyze, raw image bytes) ============ -->
<section id="step-photo" data-endpoint="POST /api/v1/face/analyze">
  <h2>2. Photo <span class="meta">(optional, analysed in memory, never stored)</span></h2>
  <input id="photo" type="file" accept="image/*">
  <img id="preview" alt="" hidden>
  <div id="photo-result" class="meta" aria-live="polite"></div>
</section>

<p><button id="go">Get my consultation</button> <span id="status" class="meta" aria-live="polite"></span></p>

<!-- ============ RESULTS  (all from POST /api/v1/consult) ============ -->
<div id="results" hidden>
  <section id="res-profile"><h2>Your skin profile</h2><div class="body"></div></section>
  <section id="res-skincare"><h2>Skincare <span class="badge" id="skincare-status"></span></h2><div class="body"></div></section>
  <section id="res-makeup"><h2>Makeup</h2><div class="body"></div></section>
  <section id="res-routine"><h2>Routine <span class="badge" id="routine-status"></span></h2><div class="body"></div></section>
  <section id="res-shopping"><h2>Shopping list</h2><div class="body"></div></section>
  <section id="res-product" hidden data-endpoint="GET /api/v1/products/{id}"><h2>Product detail</h2><div class="body"></div></section>
  <p class="meta" id="disclaimer"></p>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = st => `<span class="badge ${esc(st)}">${esc(st)}</span>`;
let face = null;   // result of /face/analyze, passed into /consult

async function api(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : `Request failed (${r.status})`);
  return j;
}
const checks = (id, items) => $(id).innerHTML = items.map(v =>
  `<label><input type="checkbox" value="${esc(v)}"> ${esc(v.replace('_', ' '))}</label>`).join('');
const picked = id => [...$(id).querySelectorAll('input:checked')].map(i => i.value);

/* ---- step 1: populate controls from the API ---- */
api('/api/v1/options').then(o => {
  o.skin_types.forEach(t => $('skin_type').add(new Option(t, t)));
  checks('concerns', o.concerns); checks('colour_prefs', o.colour_preferences);
}).catch(e => $('status').textContent = e.message);

/* ---- step 2: photo ---- */
$('photo').onchange = async () => {
  const f = $('photo').files[0]; face = null; $('photo-result').textContent = ''; $('preview').hidden = true;
  if (!f) return;
  $('preview').src = URL.createObjectURL(f); $('preview').hidden = false;
  $('photo-result').textContent = 'Analysing…';
  try {
    face = await api('/api/v1/face/analyze', {method: 'POST', body: f});
    $('photo-result').innerHTML = `<span class="sw" style="background:${esc(face.skin_hex)}"></span>Skin colour ${esc(face.skin_hex)}, tone ${esc(face.tone)}`;
  } catch (e) { $('photo-result').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
};

/* ---- consult ---- */
$('go').onclick = async () => {
  const body = {
    skin_type: $('skin_type').value || null, concerns: picked('concerns'), colour_preferences: picked('colour_prefs'),
    sensitive: $('sensitive').checked, max_price_per_item: $('max_price').value ? +$('max_price').value : null,
    avoid_ingredients: $('avoid').value.split(',').map(s => s.trim()).filter(Boolean),
    skin_hex: face ? face.skin_hex : null, skin_tone: face ? face.tone : null, per_category: 2,
  };
  $('status').textContent = 'Working…';
  try {
    const j = await api('/api/v1/consult', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
    render(j); $('status').textContent = '';
  } catch (e) { $('status').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
};

/* ---- renderers: one per results section ---- */
function render(j) {
  $('results').hidden = false;
  // profile
  $('res-profile').querySelector('.body').innerHTML = (j.profile.concerns.length
    ? j.profile.concerns.map(c => `<div class="card"><b>${esc(c.concern.replace('_', ' '))}</b><div class="meta">Helpful ingredients: ${esc(c.helpful_ingredients.join(', '))}</div></div>`).join('')
    : '<p class="meta">No concerns selected.</p>') + `<p class="meta">${esc(j.profile.disclaimer)}</p>`;
  // skincare
  $('skincare-status').outerHTML = `<span class="badge ${esc(j.skincare_status)}" id="skincare-status">${esc(j.skincare_status)}</span>`;
  $('res-skincare').querySelector('.body').innerHTML = Object.entries(j.skincare).map(([cat, items]) =>
    `<h3>${esc(cat)}</h3>` + (items.map(p => `<div class="card"><b>${esc(p.name)}</b> <span class="meta">${esc(p.brand)} · $${esc(p.price)} · source: ${esc(p.source)}</span><br>
      Score <b>${esc(p.aicosmetic_score)}</b>/100 · ${esc(p.verdict)} ${badge(p.score_status)}<div class="meta">${esc(p.why)}</div>
      <button data-pid="${esc(p.product_id)}">Details</button></div>`).join('') || '<p class="meta">No products match.</p>')).join('');
  // makeup
  const m = j.makeup, sect = (name, s) => `<h3>${name} ${badge(s.status)}</h3>` + (s.items.length
    ? s.items.map(i => `<div class="card"><span class="sw" style="background:${esc(i.hex)}"></span><b>${esc(i.brand)} ${esc(i.product)}</b> <span class="meta">${esc(i.hex)} · colour difference ${esc(i.delta_e)}</span></div>`).join('')
    : `<p class="meta">${esc(s.note)}</p>`);
  $('res-makeup').querySelector('.body').innerHTML = sect('Foundation', m.foundation) + sect('Lips', m.lips) + sect('Blush', m.blush) + sect('Eyes', m.eyes);
  // routine
  $('routine-status').outerHTML = `<span class="badge ${esc(j.routine.status)}" id="routine-status">${esc(j.routine.status)}</span>`;
  const steps = l => '<ol>' + l.map(s => `<li>${esc(s.step)}: ${esc(s.name || 'none found')}</li>`).join('') + '</ol>';
  $('res-routine').querySelector('.body').innerHTML = `<h3>Morning</h3>${steps(j.routine.am)}<h3>Evening</h3>${steps(j.routine.pm)}` +
    j.routine.warnings.map(w => `<p class="meta">${esc(w)}</p>`).join('');
  // shopping list
  $('res-shopping').querySelector('.body').innerHTML = `<p>${j.shopping_list.items.length} products, total <b>$${esc(j.shopping_list.total_price)}</b> ${badge(j.shopping_list.status)}</p>`;
  $('disclaimer').textContent = j.disclaimer;
}

/* ---- product detail (GET /api/v1/products/{id}) ---- */
document.addEventListener('click', async e => {
  const pid = e.target.dataset && e.target.dataset.pid; if (!pid) return;
  const box = $('res-product'); box.hidden = false; box.querySelector('.body').textContent = 'Loading…';
  try {
    const p = await api(`/api/v1/products/${pid}`), r = p.review_summary;
    box.querySelector('.body').innerHTML = `<b>${esc(p.name)}</b> <span class="meta">${esc(p.brand)} · ${esc(p.category)} · $${esc(p.price)}</span>
      <p class="meta">Ingredients: ${esc(p.ingredients.join(', '))}</p>
      <h3>Review summary ${badge(r.status)}</h3><p class="meta">${r.status === 'planned' ? 'Review summaries arrive in Phase 4.' : esc(JSON.stringify(r.themes))}</p>`;
    box.scrollIntoView({behavior: 'smooth'});
  } catch (err) { box.querySelector('.body').innerHTML = `<span class="err">${esc(err.message)}</span>`; }
});
</script></body></html>
