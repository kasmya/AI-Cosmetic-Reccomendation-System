<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmetic Recommender</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#767676;--line:#e8e8e8}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#8a8a8a;--line:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px}
h1{font-size:22px;font-weight:600;margin:0}
.sub{color:var(--mut);margin:4px 0 32px;font-size:14px}
form{display:grid;gap:16px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
select,input,button{font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;border-radius:0}
select:focus,input:focus{outline:0;border-color:var(--fg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
.check input{width:auto}
button{border:1px solid var(--fg);padding:10px;cursor:pointer;margin-top:8px}
button:hover{background:var(--fg);color:var(--bg)}
#out{margin-top:32px}
.item{padding:16px 0;border-top:1px solid var(--line)}
.item b{font-weight:600}.meta{color:var(--mut);font-size:13px}.why{font-size:13px;margin-top:4px;color:var(--mut)}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Cosmetic Recommender</h1>
<p class="sub">Skincare picks ranked by a trained model over 8.6k real reviews.</p>
<form id="f">
<div class="row">
<label>Skin type<select id="skin"><option value="">Not sure</option><option>Combination</option><option>Dry</option><option>Normal</option><option>Oily</option></select></label>
<label>Category<select id="cat"><option value="">Any</option><option>Cleanser</option><option>Moisturizer</option><option>Treatment</option><option>Face Mask</option></select></label>
</div>
<div class="row">
<label>Max price ($)<input id="price" type="number" min="0" placeholder="no limit"></label>
<label>Avoid ingredients<input id="avoid" placeholder="fragrance, alcohol"></label>
</div>
<label>A product you liked (optional)<input id="liked" list="products" placeholder="start typing a product name"></label>
<datalist id="products"></datalist>
<label class="check"><input id="sens" type="checkbox"> Sensitive skin</label>
<button>Recommend</button>
</form>
<div id="out" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id),ids={};
fetch('/products?limit=400').then(r=>r.json()).then(ps=>ps.forEach(p=>{
  const label=`${p.Product} (${p.Brand})`;ids[label]=p.Product_id;
  const o=document.createElement('option');o.value=label;$('products').append(o)}));
$('f').onsubmit=async e=>{e.preventDefault();const out=$('out');
  const liked=ids[$('liked').value];
  const body={skin_type:$('skin').value||null,category:$('cat').value||null,
    max_price:$('price').value?+$('price').value:null,sensitive:$('sens').checked,
    avoid_ingredients:$('avoid').value.split(',').map(s=>s.trim()).filter(Boolean),
    liked_product_ids:liked?[liked]:[],k:8};
  out.textContent='Loading…';
  try{const r=await fetch('/recommend',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status);const j=await r.json();out.textContent='';
    if(!j.count){out.textContent='No products match those filters.';return}
    j.results.forEach(p=>{const d=document.createElement('div');d.className='item';
      const b=document.createElement('b');b.textContent=p.Product;
      const m=document.createElement('div');m.className='meta';m.textContent=`${p.Brand} · ${p.Category} · $${p.Price}`;
      const w=document.createElement('div');w.className='why';w.textContent=p.why;
      d.append(b,m,w);out.append(d)})
  }catch(err){out.textContent='Something went wrong ('+err.message+')'}};
</script></main></body></html>
